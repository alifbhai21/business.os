# Phase 13 — Render Blueprint (Infrastructure as Code)
#
# Deploys the Express API as TWO isolated services from this one file:
#   • business-os-api-staging   → staging MongoDB database + secrets
#   • business-os-api           → production MongoDB database + secrets
#
# Apply with:  Render Dashboard → New → Blueprint → point at this repo.
# Render prompts for every `sync: false` value at apply time — those values
# are NEVER stored in git.
#
# Required values (entered in the Render dashboard, per environment):
#   MONGODB_URI   Atlas URI of THAT environment's database, e.g.
#                 mongodb+srv://<restricted-user>:<pass>@<cluster>.mongodb.net/business_os_staging
#                 (staging and production MUST use separate databases and
#                 separate least-privilege DB users — see docs/deployment.md)
#   CORS_ORIGIN   explicit comma-separated allowlist of the mobile/web
#                 origins, e.g. https://app.example.com
#                 ("*" is rejected by the server in production mode)
# JWT secrets are GENERATED BY RENDER per service (generateValue: true) so
# they are unique per environment and never transit git or this file.

services:
  # ---------------------------------------------------------------- staging
  - type: web
    name: business-os-api-staging
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ready          # /ready reports DB connectivity truthfully
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production            # enables HTTPS redirect + secret gate
      - key: MONGODB_URI
        sync: false                  # staging Atlas URI (business_os_staging)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: AUTH_MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: AUTH_LOCKOUT_MINUTES
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: CORS_ORIGIN
        sync: false                  # explicit origin allowlist

  # ------------------------------------------------------------- production
  - type: web
    name: business-os-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    autoDeploy: false                # production promotes deliberately
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false                  # production Atlas URI (business_os)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: AUTH_MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: AUTH_LOCKOUT_MINUTES
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: CORS_ORIGIN
        sync: false
